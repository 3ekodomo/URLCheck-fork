name: Fix Gradle Permission

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-permission:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Gradle wrapper permission
        run: chmod +x gradlew

      - name: Save executable permission to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew

          if git diff --cached --quiet; then
            echo "No permission change needed."
          else
            git commit -m "Fix Gradle wrapper executable permission"
            git push
          fi

      - name: Verify permission
        run: ls -l gradlew
